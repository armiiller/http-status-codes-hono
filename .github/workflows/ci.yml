name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  deploy:
    name: Deploy to Cloudflare Workers
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run css

      # Runs `wrangler deploy` using the wrangler version already installed
      # via `npm ci` above, so CI deploys with the exact version tests ran
      # against. Requires the CLOUDFLARE_API_TOKEN repo secret (and
      # CLOUDFLARE_ACCOUNT_ID if the token can access more than one account).
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Tells IndexNow-participating search engines (Bing, Yandex, and
      # others - not Google, which doesn't support IndexNow) to recrawl the
      # site now instead of waiting for their own schedule. The key/domain
      # come straight from wrangler.jsonc so there's nothing to keep in sync
      # here; the Worker itself serves /<key>.txt for ownership verification
      # (see public/). No account or signup needed - this is a no-op if the
      # search engines don't recognize the key yet.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          KEY=$(jq -r '.vars.INDEXNOW_KEY' wrangler.jsonc)
          DOMAIN=$(jq -r '.routes[0].pattern' wrangler.jsonc)
          curl -fsS "https://api.indexnow.org/indexnow?url=https://${DOMAIN}/&key=${KEY}"
